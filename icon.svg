<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
    <!-- Hangman Structure -->
    <g fill="none" stroke="#10b981" stroke-width="32" stroke-linecap="round" stroke-linejoin="round">
        <!-- Base -->
        <line x1="128" y1="416" x2="256" y2="416" />
        <!-- Pole -->
        <line x1="192" y1="416" x2="192" y2="96" />
        <!-- Top -->
        <line x1="192" y1="96" x2="320" y2="96" />
        <!-- Support -->
        <line x1="192" y1="160" x2="256" y2="96" />
        <!-- Rope -->
        <line x1="320" y1="96" x2="320" y2="160" />
    </g>
    
    <!-- Person (Head & Torso) -->
    <g fill="#10b981">
        <circle cx="320" cy="208" r="48" />
        <path d="M 288 272 L 352 272 L 352 384 L 288 352 Z" />
    </g>
    
    <!-- Arm -->
    <line x1="352" y1="288" x2="416" y2="352" fill="none" stroke="#10b981" stroke-width="32" stroke-linecap="round" />
</svg>
